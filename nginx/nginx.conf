events { worker_connections 1024; }

http {
    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:3000; }

    server {
        listen 80;
        client_max_body_size 60M;

        location /api/      { proxy_pass http://backend; proxy_set_header Host $host; }
        location /docs      { proxy_pass http://backend; }
        location /redoc     { proxy_pass http://backend; }
        location /metrics   { proxy_pass http://backend; }
        location /health    { proxy_pass http://backend; }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
