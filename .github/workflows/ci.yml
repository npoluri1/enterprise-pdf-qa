name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: |
          pip install ruff mypy \
            pydantic==2.10.3 pydantic-settings==2.6.1 \
            fastapi==0.115.5 sqlalchemy[asyncio]==2.0.36 asyncpg==0.30.0 \
            structlog==24.4.0 python-jose[cryptography]==3.3.0 bcrypt==4.2.1 \
            langchain==0.3.14 langgraph==0.2.60 \
            langchain-openai==0.2.14 langchain-anthropic==0.3.3 \
            langchain-community==0.3.14 \
            celery==5.4.0 redis==5.2.1 \
            anyio==4.7.0 aiofiles==24.1.0 \
            httpx==0.28.0 uvicorn[standard]==0.32.1 \
            python-multipart==0.0.12 numpy==1.26.4 \
            tenacity==9.0.0 pgvector==0.3.6 \
            prometheus-fastapi-instrumentator==7.0.0

      - name: Ruff lint
        run: ruff check app/

      - name: Ruff format check
        run: ruff format --check app/

      - name: Mypy type check
        run: mypy app/ --ignore-missing-imports

  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pdf_qa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
      # DATABASE_URL points to the base db; conftest replaces /pdf_qa → /pdf_qa_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pdf_qa
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      OPENAI_API_KEY: sk-test-placeholder
      ANTHROPIC_API_KEY: sk-ant-test-placeholder
      PRIMARY_LLM: openai
      EMBEDDING_PROVIDER: openai
      EMBEDDING_DIMENSION: "1536"
      ALLOWED_ORIGINS: '["http://localhost:3000"]'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -m "not integration" -v --tb=short

      - name: Run integration tests
        run: pytest tests/ -m "integration" -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  frontend-test:
    name: Frontend — Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: frontend/coverage/coverage-final.json
          flags: frontend

  # ── Security Audit ─────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2024-114
        continue-on-error: true

      - name: Audit Node dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
        continue-on-error: true

  # ── Docker Build Check ─────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t pdf-qa-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t pdf-qa-frontend:ci ./frontend